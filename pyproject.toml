[project]
name = "recsys"
version = "0.1.0"
description = "MovieLens recommender service: ALS + LightGBM ranking with an MLOps pipeline"
authors = [
    { name = "mark37mur-ops" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
