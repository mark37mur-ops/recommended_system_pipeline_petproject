name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  integration:
    # API + database tests against real Postgres and Redis (spec 6.5).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/app_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m integration -v

  docker:
    # Images must build and the compose file must be valid; pushing is stage 7.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example --profile tools config -q
      - run: docker build -f docker/api.Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t movielens-recsys-api:ci .
      - run: docker build -f docker/mlflow.Dockerfile -t movielens-recsys-mlflow:ci .
      - name: API image imports the service and ships only the MLflow client
        run: >
          docker run --rm movielens-recsys-api:ci python -c
          "import importlib.metadata as m, recsys_api.main;
          names = {d.metadata['Name'].lower() for d in m.distributions()};
          assert 'mlflow' not in names, 'full mlflow in the API image';
          print(sorted(n for n in names if n.startswith('mlflow')))"
      - name: API image can also train (lightgbm sklearn API needs scikit-learn)
        run: docker run --rm movielens-recsys-api:ci python -c "import lightgbm; lightgbm.LGBMRanker()"

  airflow:
    # The DAGs need Airflow, which is not in the project venv (its pins conflict with
    # uv.lock), so the DAG integrity tests run inside the Airflow image they ship in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/airflow.Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t movielens-recsys-airflow:ci .
      - name: DAG integrity (DagBag, graph, retries, recsys venv) inside the image
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint bash movielens-recsys-airflow:ci
          -c "pip install -q pytest==9.2.0 && python -m pytest -p no:cacheprovider -v tests/dags"
