name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  integration:
    # API + database tests against real Postgres and Redis (spec 6.5).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/app_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m integration -v

  docker:
    # Images must build and the compose file must be valid; pushing is the `publish` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example --profile tools config -q
      - name: Prometheus config is valid (promtool from the pinned image)
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/cfg:ro"
          prom/prometheus:v3.15.1 check config /cfg/prometheus.yml
      - run: docker build -f docker/api.Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t movielens-recsys-api:ci .
      - run: docker build -f docker/mlflow.Dockerfile -t movielens-recsys-mlflow:ci .
      - name: API image imports the service, ships only the MLflow client and no Evidently
        run: >
          docker run --rm movielens-recsys-api:ci python -c
          "import importlib.metadata as m, recsys_api.main;
          names = {d.metadata['Name'].lower() for d in m.distributions()};
          assert 'mlflow' not in names, 'full mlflow in the API image';
          assert 'evidently' not in names, 'evidently in the API image';
          print(sorted(n for n in names if n.startswith('mlflow')))"
      - name: API image can also train (lightgbm sklearn API needs scikit-learn)
        run: docker run --rm movielens-recsys-api:ci python -c "import lightgbm; lightgbm.LGBMRanker()"

  airflow:
    # The DAGs need Airflow, which is not in the project venv (its pins conflict with
    # uv.lock), so the DAG integrity tests run inside the Airflow image they ship in.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # pytest goes in with Airflow's own constraints, so it cannot move packaging / pluggy /
      # pygments under the Airflow being tested.
      AIRFLOW_CONSTRAINTS: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/airflow.Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t movielens-recsys-airflow:ci .
      - name: DAG integrity (DagBag, graph, retries, params, recsys venv) inside the image
        run: >
          docker run --rm -e AIRFLOW_CONSTRAINTS -v "$PWD:/repo:ro" -w /repo --entrypoint bash
          movielens-recsys-airflow:ci
          -c 'pip install -q pytest --constraint "$AIRFLOW_CONSTRAINTS" && python -m pytest -p no:cacheprovider -v tests/dags'

  infra:
    # Server-side configuration (stages 6-7). These files only "run" on the server, so a typo
    # would otherwise surface during a deploy; here it turns the commit red instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The merged result is what the server runs: needs Compose >= 2.24 (`!reset`).
      - name: Production compose override is valid
        run: >
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml
          --profile tools config -q
      - name: Caddyfile is valid (the pinned Caddy image of docker-compose.prod.yml)
        run: >
          docker run --rm -e SITE_ADDRESS=example.sslip.io -v "$PWD/infra/caddy:/etc/caddy:ro"
          caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Shell scripts pass shellcheck
        run: >
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0
          infra/scripts/*.sh infra/grafana/start.sh infra/postgres/init/*.sh
      # Workflow syntax, expressions, and shellcheck on every `run:` script (deploy.yml runs
      # only with a server, so its mistakes would otherwise show up on the first real deploy).
      - name: Workflows pass actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -no-color

  publish:
    # Stage 7 (spec 6.4): after every check above is green on a push to main, build the three
    # images the server runs and push them to GitHub Container Registry. The server never
    # builds: it pulls exactly these bytes (.github/workflows/deploy.yml, infra/scripts/deploy.sh).
    # Pull requests and other branches stop at the checks. Third-party actions here run with a
    # token that can write packages, so they are pinned to a commit (a moved tag cannot change
    # them), with the version as a comment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, integration, docker, airflow, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The only job that may write packages; every other job keeps `contents: read`.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: airflow
            dockerfile: docker/airflow.Dockerfile
          - image: mlflow
            dockerfile: docker/mlflow.Dockerfile
    steps:
      - uses: actions/checkout@v7
      # ghcr.io/<owner>/<repo>-<image>: GHCR rejects upper case, and the owner or repository
      # name may contain it, so lower-case it (${VAR,,} is bash for "to lower case").
      # Tags: sha-<7 chars> is what deploy.sh deploys and rolls back to; latest is a convenience
      # for a manual `docker pull`, never deployed by the workflow.
      - name: Image name and tags
        id: names
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE"
          echo "tags=$name:sha-${GITHUB_SHA::7},$name:latest" >> "$GITHUB_OUTPUT"
      # Buildx with the docker-container driver: needed for the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # GITHUB_TOKEN of this run: no personal token stored anywhere, valid until the job ends.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.names.outputs.tags }}
          # `source` links the package to this repository (its page, and the deploy job's
          # GITHUB_TOKEN may pull it); `revision` says which commit is inside.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache per image in the Actions cache: unchanged dependency layers are not
          # rebuilt (the Airflow image takes minutes from scratch). mode=max also caches the
          # builder stages, which are not part of the final image.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
