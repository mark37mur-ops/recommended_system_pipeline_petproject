# Local stack (spec 1, 6.2): Postgres (app, mlflow, airflow DBs), Redis, MLflow server, API,
# Airflow (api-server + scheduler + dag-processor, LocalExecutor), Prometheus + Grafana (spec 5).
#   cp .env.example .env   # and replace every change-me (the API and Airflow refuse them)
#   docker compose up -d --build
#   Airflow UI http://localhost:8080 (user admin, password AIRFLOW_ADMIN_PASSWORD):
#     trigger bootstrap_data once (MovieLens 1M -> Postgres), then unpause retrain_daily.
#   One-off jobs without Airflow (stage 3, still work):
#   docker compose --profile tools run --rm loader    # MovieLens 1M -> Postgres (idempotent)
#   docker compose --profile tools run --rm trainer   # train + register champion on MLflow
#   curl -X POST -H "Authorization: Bearer $ADMIN_TOKEN" localhost:8000/admin/reload-model
#   Grafana http://localhost:3000 (user admin, password GRAFANA_ADMIN_PASSWORD); the public
#     read-only link is printed by `docker compose logs grafana-publish`.
#   Prometheus http://localhost:9090 (Status -> Targets: is the API scraped?).
# Every port is published on 127.0.0.1 of the host only (MLflow, Airflow, Prometheus and the
# Grafana admin UI have to be reached over an SSH tunnel on the server; the API and the public
# dashboard through Caddy in docker-compose.prod.yml, stage 6, which must NOT proxy /metrics).
name: movielens-recsys

x-api-image: &api-image
  image: movielens-recsys-api:local
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}

x-app-db: &app-db
  DATABASE_URL: postgresql+psycopg://app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/app

x-db-passwords: &db-passwords
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
  MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}
  AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
  # Read-only role grafana_reader (stage 5): Grafana's view of the app database.
  GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}

# Shared by every Airflow container. Why these settings:
# - LocalExecutor: tasks run as subprocesses of the scheduler; no Celery workers and queue on
#   a single 8 GB server;
# - one api-server worker, one DAG-parsing process, parallelism 2: Airflow stays around
#   1-1.5 GB idle (the training task itself peaks at ~1 GB inside the scheduler container);
# - JWT secret and API secret key are shared: in Airflow 3 task processes talk to the
#   api-server's Execution API with JWTs, so every component must sign with the same key;
# - DATABASE_URL, MLflow, API, ADMIN_TOKEN and /data are for the recsys task processes,
#   which inherit this environment.
x-airflow: &airflow
  image: movielens-recsys-airflow:local
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  restart: unless-stopped
  environment: &airflow-env
    <<: *app-db
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_HTTP_REQUEST_MAX_RETRIES: "3"
    MLFLOW_HTTP_REQUEST_TIMEOUT: "60"
    API_URL: http://api:8000
    ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    RUNS_DIR: /data/runs
    RAW_DIR: /data/raw
  volumes:
    - airflow-data:/data
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *db-passwords
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during the first-start init the entrypoint runs a temporary server that
      # listens on the unix socket only, so this passes only once init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The scripts in /docker-entrypoint-initdb.d run only on an empty data volume. This one-shot
  # job runs the same idempotent script against the running server on every `up`, so an
  # existing volume (from stage 3) gets the airflow database and role passwords follow .env.
  db-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "/init/01-create-databases.sh"]
    environment:
      <<: *db-passwords
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./infra/postgres/init:/init:ro
    # The postgres image declares VOLUME /var/lib/postgresql/data; without this every
    # recreation of this client-only job would leave an anonymous volume behind.
    tmpfs:
      - /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Pure cache + rate-limit counters: no persistence, bounded memory.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    image: movielens-recsys-mlflow:local
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=postgresql+psycopg://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=/mlartifacts
      # Host header check (DNS-rebinding protection): the API/trainer call it as mlflow:5000,
      # the browser via an SSH tunnel as localhost:5000.
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    environment:
      # MLflow 3.18 starts ~9 background job processes (GenAI scorers) by default, ~2 GB RSS;
      # tracking + registry do not need them.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *app-db
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Fail a reload in seconds instead of retrying for minutes (MLflow client default).
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      # No tqdm progress bar while the champion downloads: it is not a JSON log line.
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MODEL_RETRY_SECONDS: ${MODEL_RETRY_SECONDS:-30}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      # GET /recommendations per IP and per visitor (each answer writes impressions).
      RECOMMENDATIONS_RATE_LIMIT_PER_MINUTE: ${RECOMMENDATIONS_RATE_LIMIT_PER_MINUTE:-120}
      # Proxies whose X-Forwarded-For uvicorn trusts (client IP for the rate limit). Stage 6:
      # set it to Caddy's address, otherwise every visitor shares Caddy's (or the Docker
      # gateway's) IP and thus one rate-limit bucket.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # The API creates the monitoring views and grants them to grafana_reader at start-up;
      # db-init creates that role, so it has to run first.
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Not "healthy": the API starts without MLflow (popularity fallback) and retries.
      mlflow:
        condition: service_started
    healthcheck:
      # Liveness only; /ready reports degradation (no model, no database) separately.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ----- Airflow (spec 4) ------------------------------------------------------------------
  # Refuses weak secrets, then creates or upgrades Airflow's metadata schema and exits; the
  # others wait for it. `:?` only catches empty values, `change-me` is caught here, at
  # container start (so `docker compose config` with .env.example stays valid for CI).
  airflow-init:
    <<: *airflow
    restart: "no"
    command:
      - bash
      - -c
      - /opt/recsys-venv/bin/python -m recsys.secrets_check && exec airflow db migrate
    environment:
      <<: *airflow-env
      # Under their .env names, so the error says which line of .env to fix.
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW_JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW_API_SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    depends_on:
      db-init:
        condition: service_completed_successfully

  # UI + REST API + the Execution API the task processes report to.
  airflow-apiserver:
    <<: *airflow
    # SimpleAuthManager (the Airflow 3 default) reads passwords from a JSON file and generates
    # random ones for users missing from it. Writing the file from .env first gives a known
    # admin password and no generated password in the logs.
    command:
      - bash
      - -c
      - >-
        python -c "import json, os; json.dump({os.environ['AIRFLOW_ADMIN_USER']:
        os.environ['AIRFLOW_ADMIN_PASSWORD']},
        open(os.environ['AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE'], 'w'))"
        && exec airflow api-server
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  # Decides what runs when; with LocalExecutor the tasks also run here, as subprocesses.
  airflow-scheduler:
    <<: *airflow
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      # Task processes report to the api-server's Execution API.
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8974/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  # Airflow 3 parses DAG files in a separate process; the scheduler no longer does it.
  airflow-dag-processor:
    <<: *airflow
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 5

  # ----- Monitoring (spec 5) ---------------------------------------------------------------
  # Prometheus pulls /metrics from the API every 15 s (infra/prometheus/prometheus.yml) and keeps
  # 7 days or 512 MB of samples, whichever is smaller: enough for the dashboard and the alerts,
  # small for one 8 GB server.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # Same policy as airflow-init: refuse placeholder or short Grafana secrets before Grafana
  # starts (the Grafana image has no Python, the API image has recsys.secrets_check).
  grafana-init:
    <<: *api-image
    restart: "no"
    command: ["python", "-m", "recsys.secrets_check", "grafana"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GRAFANA_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}

  # Dashboards, data sources and alert rules all come from infra/grafana (provisioning): the
  # Grafana volume only holds users, sessions, alert state and the public-dashboard token.
  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    # Assembles the provisioning directory (Telegram only when configured), then runs the
    # image's own entrypoint; see infra/grafana/start.sh.
    entrypoint: ["sh", "/etc/grafana/start.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Encrypts data source passwords in Grafana's database; the built-in default is public.
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Only the admin logs in; visitors see the public dashboard link (no account, no login).
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana 13 downloads ~180 MB of "preinstalled" app plugins at start and then uses
      # ~660 MB RAM; without them ~250 MB. Prometheus and Postgres sources are built in.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # JSON lines on stdout, like the API (spec 5.6).
      GF_LOG_CONSOLE_FORMAT: json
      # Stage 6 sets it to https://<host>/grafana/ (and serves from that sub-path behind Caddy).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/recsys.json
      # Referenced from the provisioning files as ${...}; Grafana substitutes them at start-up.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
      # Optional (spec 5.5): both empty -> no Telegram contact point, alerts in the UI only.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./infra/grafana/start.sh:/etc/grafana/start.sh:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning-repo:ro
      - ./infra/grafana/telegram.yml:/etc/grafana/telegram.yml:ro
      - ./infra/grafana/telegram-off.yml:/etc/grafana/telegram-off.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      grafana-init:
        condition: service_completed_successfully
      # The read-only role its Postgres data source logs in with.
      db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  # One-shot after every start: makes sure the dashboard has its public read-only copy and
  # prints the link (file provisioning cannot do this; see infra/grafana/publish_dashboard.py).
  grafana-publish:
    <<: *api-image
    restart: "no"
    command: ["python", "/scripts/publish_dashboard.py"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ./infra/grafana/publish_dashboard.py:/scripts/publish_dashboard.py:ro
    depends_on:
      grafana:
        condition: service_healthy

  # ----- one-off jobs (docker compose --profile tools run --rm <name>) -------------------
  loader:
    <<: *api-image
    profiles: ["tools"]
    command: ["python", "-m", "recsys.db.load_movielens",
              "--data-dir", "/data/raw/ml-1m", "--download"]
    environment:
      <<: *app-db
    volumes:
      - movielens:/data
    depends_on:
      postgres:
        condition: service_healthy

  trainer:
    <<: *api-image
    profiles: ["tools"]
    # Trains on the raw MovieLens files (no web ratings); retrain_daily in Airflow extracts
    # ratings, incl. web, from Postgres instead. The model is registered on the MLflow server, artifacts are
    # uploaded over HTTP (mlflow-artifacts:/), so no volume is shared with MLflow.
    command: ["python", "-m", "recsys.pipelines.train",
              "--data-dir", "/data/raw/ml-1m", "--tmp-dir", "/tmp/recsys"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - movielens:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  mlartifacts:
  movielens:  # ml-1m.zip + extracted files, filled by `loader --download`
  # /data of the Airflow containers: raw/ (bootstrap_data's ml-1m.zip) and runs/{run_id}/
  # (Parquet and models handed from task to task). Separate from `movielens`, which belongs
  # to the API image's user (uid 10001); Airflow runs as uid 50000.
  airflow-data:
  airflow-logs:  # task logs: written by the scheduler, read by the api-server for the UI
  prometheus-data:  # time series (7 days / 512 MB)
  grafana-data:  # Grafana's own SQLite: admin user, alert state, public-dashboard token
